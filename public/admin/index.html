<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>AIKaFanda CMS</title>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;

      if (!window.crypto) {
        window.crypto = {};
      }

      if (!window.crypto.randomUUID) {
        window.crypto.randomUUID = function () {
          if (window.crypto.getRandomValues) {
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;

            const hex = Array.from(bytes, (byte) =>
              byte.toString(16).padStart(2, "0")
            );

            return [
              hex.slice(0, 4).join(""),
              hex.slice(4, 6).join(""),
              hex.slice(6, 8).join(""),
              hex.slice(8, 10).join(""),
              hex.slice(10, 16).join(""),
            ].join("-");
          }

          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (char) {
            const random = Math.random() * 16 | 0;
            const value = char === "x" ? random : (random & 0x3) | 0x8;
            return value.toString(16);
          });
        };
      }
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.8.0/dist/decap-cms.js"></script>
    <script>
      (async function initDecap() {
        const response = await fetch("/admin/config.yml", { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Failed to load Decap config.");
        }

        const rawConfig = await response.text();
        const normalizedConfig = rawConfig.replace(
          /^(\s*base_url:\s*).+$/m,
          '$1"' + window.location.origin + '"'
        );
        const config = window.jsyaml.load(normalizedConfig);
        config.load_config_file = false;
        const init = window.initCMS || (window.CMS && window.CMS.init);

        if (!init) {
          throw new Error("Decap CMS init function is unavailable.");
        }

        init({ config });
      })().catch((error) => {
        console.error(error);
        document.body.innerHTML =
          '<p style="padding:24px;font:16px/1.5 system-ui,sans-serif">Failed to start Decap CMS. Check the browser console for details.</p>';
      });
    </script>
  </body>
</html>
