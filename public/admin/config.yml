# ============================================================================
# Decap CMS Configuration for AIKaFanda
# ============================================================================

backend:
  name: github
  repo: techcorp/aikafanda-site
  branch: main
  base_url: "__SITE_ORIGIN__"
  auth_endpoint: "api/auth"
  auth_scope: repo

publish_mode: editorial_workflow

media_folder: "public/images/blogs"
public_folder: "/images/blogs"

slug:
  encoding: "ascii"
  clean_replacements: ["--"]
  sanitizers:
    "[äàáâã]": "a"
    "[éèêë]": "e"
    "[íìîï]": "i"
    "[óòôõ]": "o"
    "[úùûü]": "u"
    "[ñ]": "n"
    "[ç]": "c"

collections:
  - name: "blogs"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blogs"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} - {{date}}"
    sortable_fields:
      - "date"
      - "title"
      - "category"
      - "status"
    view_filters:
      - label: "Published"
        field: "status"
        pattern: "published"
      - label: "Draft"
        field: "status"
        pattern: "draft"
      - label: "Featured"
        field: "featured"
        pattern: "true"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The main title of the blog post."

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-friendly identifier. Use lowercase words separated by hyphens (e.g. my-blog-post)."

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "A short summary shown on the blog listing page and in SEO results."

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ssZ"
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"

      - label: "Updated Date"
        name: "updatedDate"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ssZ"
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
        hint: "Optional. Set when the post was significantly updated."

      - label: "Author"
        name: "author"
        widget: "string"
        default: "AIKaFanda Team"

      - label: "Author Image"
        name: "authorImage"
        widget: "image"
        required: false
        hint: "Optional author avatar or headshot."

      - label: "Featured Image"
        name: "featuredImage"
        widget: "image"
        hint: "The main image displayed on the blog listing and article page."

      - label: "Featured Image Alt Text"
        name: "featuredImageAlt"
        widget: "string"
        hint: "Descriptive alt text for accessibility and SEO."

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Artificial Intelligence"
          - "Automation"
          - "Cybersecurity"
          - "Web Development"
          - "Mobile Applications"
          - "Business"
          - "Technology"
          - "Company News"
        default: "Technology"
        hint: "Select the primary category for this post."

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Add relevant tags for filtering and SEO."

      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - "draft"
          - "published"
        default: "draft"
        hint: "Draft posts are hidden from the public website."

      - label: "Featured Post"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured posts are highlighted at the top of the blog listing."

      - label: "SEO Title"
        name: "seoTitle"
        widget: "string"
        hint: "Title used for search engines and social sharing. Defaults to the post title if empty."

      - label: "SEO Description"
        name: "seoDescription"
        widget: "text"
        hint: "Meta description for search engines. Keep under 160 characters."

      - label: "Canonical URL"
        name: "canonicalUrl"
        widget: "string"
        required: false
        hint: "Optional. Set only if this content is republished from another source."

      - label: "Open Graph Image"
        name: "ogImage"
        widget: "image"
        required: false
        hint: "Optional. Image used for social media sharing. Falls back to Featured Image."

      - label: "Content"
        name: "body"
        widget: "markdown"
        hint: "Write the blog content using Markdown."
